id: CL-SEC-2026-0207
title: "ExtendedKeyUsage not enforced during certificate chain verification in pure-tls"
reported: 2026-06-21
published: 2026-06-21
severity: low
cvss: "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:L/I:L/A:N"
cvss-score: 4.2
cwe: CWE-295  # Improper Certificate Validation

