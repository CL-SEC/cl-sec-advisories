description: |
  This is an incomplete-fix follow-on to CL-SEC-2026-0132.

  The protocol-allowed-p function (src/policies.lisp) permits relative
  URLs by accepting any value whose first character is "/", and -- after
  the CL-SEC-2026-0132 fix (commit 10cc58c, v1.0.0) -- rejecting
  protocol-relative URLs that begin with "//". However, that fix only
  special-cases the forward slash:

      (and (> (length url-lower) 0)
           (char= (char url-lower 0) #\/)
           (or (<= (length url-lower) 1)
               (char/= (char url-lower 1) #\/)))

  Per the WHATWG URL Standard, a backslash is treated as equivalent to a
  forward slash in the authority position of special-scheme (http/https)
  URLs. Browsers therefore resolve "/\evil.com/x", "\/evil.com", and
  "\\evil.com" as the network-path (protocol-relative) reference
  "//evil.com/x" -> "https://evil.com/x". Because the sanitizer only
  rejects a literal "//", the value "/\evil.com/..." passes the relative-
  URL allowance (second character is "\", not "/") and is preserved on
  href, src, cite, poster, background, and srcset attributes. The
  attacker-controlled domain is then loaded by the victim's browser.

  As with CL-SEC-2026-0132, this enables tracking pixels and IP/data
  exfiltration via auto-loaded <img src> (no user interaction required),
  and open-redirect / phishing via <a href> on click. The bypass affects
  the default policy; no special configuration is needed. The entity-
  encoded form (e.g. "/&#92;evil.com") is normalized to the same payload
  and is likewise affected.

  Confirmed against the built library (SBCL 2.6.5, plump 20260218):

      (protocol-allowed-p *default-policy* "//evil.com/x")  => NIL  ; 0132
      (protocol-allowed-p *default-policy* "/\\evil.com/x")  => T    ; bypass

      (sanitize-html "<img src='/\\evil.com/track.gif'>")
        => "<img src=\"/\\evil.com/track.gif\">"

recommendation: |
  Update to cl-sanitize-html 1.0.1 or later. The fix treats the backslash
  as equivalent to the forward slash before the relative-URL check: a URL
  is rejected whenever its first two characters are each a path separator
  in the set { "/", "\" } -- i.e. //, /\, \/, and \\ are all protocol-
  relative -- so a relative URL is accepted only when it starts with a
  single separator that is not immediately followed by another separator.

