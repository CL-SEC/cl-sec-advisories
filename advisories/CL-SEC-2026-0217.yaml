id: CL-SEC-2026-0217
title: "Unbounded recursion on post-handshake records allows remote denial of service in pure-tls"
reported: 2026-09-17
published: 2026-09-17
severity: high
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H"
cvss-score: 7.5
cwe: CWE-674  # Uncontrolled Recursion

project:
  name: pure-tls
  homepage: https://github.com/atgreen/pure-tls
  affected-systems:
    - pure-tls

affected:
  introduced-in:  # 2026-01-02, initial implementation
    commit: "de204fb"
    url: "https://github.com/atgreen/pure-tls/commit/de204fb"
  fixed-in:
    commit: "dc7f408"
    version: "1.15.0"
    url: "https://github.com/atgreen/pure-tls/commit/dc7f408"
  affected-dists:
