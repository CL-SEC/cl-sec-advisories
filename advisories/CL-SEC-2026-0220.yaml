id: CL-SEC-2026-0220
title: "Empty client trust store does not fail closed under mutual TLS on macOS and Windows in pure-tls"
reported: 2026-09-17
published: 2026-09-17
severity: high
cvss: "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N"
cvss-score: 7.4
cwe: CWE-295  # Improper Certificate Validation

project:
  name: pure-tls
  homepage: https://github.com/atgreen/pure-tls
  affected-systems:
    - pure-tls

affected:
  introduced-in:  # 2026-01-05, mTLS client-certificate verification added
    commit: "fee3307"
    url: "https://github.com/atgreen/pure-tls/commit/fee3307"
  fixed-in:
    commit: "5c18ccd"
    version: "1.15.0"
    url: "https://github.com/atgreen/pure-tls/commit/5c18ccd"
  affected-dists:
