      fixed-in: "20260917-85465dd"

description: |
  process-client-certificate-verify guarded client-certificate chain
  verification on the mere presence of a trust store, not on its containing any
  certificates.  An empty-but-non-NIL trust store therefore passed the guard
  and reached verify-certificate-chain with an empty list of roots.

  On macOS and Windows that is not a refusal.  verify-certificate-chain
  dispatches to the native verifier before reaching the pure-Lisp "no trusted
  root certificates available" check, and both native backends treat an empty
  anchor list as an instruction to use the operating system trust store.  This
  is deliberate for the default configuration — *use-macos-keychain* and
  *use-windows-certificate-store* both default to true so the OS decides — but
  it means a server that supplied a deliberately restricted anchor set, and
  supplied an empty one, silently accepted any client certificate chaining to
  any publicly-trusted root instead of the intended private CA.

  The condition is reachable by ordinary misconfiguration rather than
  contrivance: make-trust-store-from-directory warns on unreadable files but
  returns an empty store without error, so a wrong or empty CA directory path
  produces exactly this state.  make-tls-context's :ca-file / :ca-directory
  path does error on zero usable certificates, so client connections were not
  affected; only a server passing :trust-store directly to
  make-tls-server-stream was.

  The fix requires the trust store to contain certificates before mTLS
  verification proceeds, on every platform.  The overloaded meaning of an empty
  anchor list at the native dispatch is now documented, with a warning that
  callers supplying a restricted anchor set must make the same check.

recommendation: |
  Update to pure-tls 1.15.0 or later.  On earlier versions, verify that any
  trust store passed as :trust-store to make-tls-server-stream is non-empty
  before use — (pure-tls::trust-store-certificates store) must be non-NIL.

references:
  - https://cwe.mitre.org/data/definitions/295.html
  - https://datatracker.ietf.org/doc/html/rfc8446#section-4.4.2.4
