description: |
  cl-sanitize-html sanitizes by parsing untrusted HTML with Plump,
  mutating the DOM, and re-serializing.  For text nodes and attribute
  values this is safe because Plump's serializer entity-encodes "<", ">",
  '"', and "&".  Comment nodes are the exception: their text is emitted
  verbatim, and the sanitizer does not neutralize it.

  When a policy is configured with :remove-comments nil (a supported,
  exported option -- the three built-in policies remove comments), the
  comment sanitize-node method (src/sanitizer.lisp) preserves the comment
  as-is.  Two Plump behaviours then combine into a comment-breakout XSS:

    1. Plump's comment tokenizer ends a comment only at "-->", but the
       HTML standard (and every browser) also ends a comment at "--!>"
       and via the abrupt-close forms "<!-->" / "<!--->".  Plump stores
       such a sequence as ordinary comment *content*.
    2. Plump decodes entities in comment text at parse time and emits the
       result raw at serialize time, so an entity-encoded terminator such
       as "&#45;&#45;!>" (== "--!>") or "&#45;&#45;&#62;" (== "-->") is
       decoded into an active terminator before output.

  A preserved comment therefore round-trips into output that a browser
  re-parses as: comment-end + live markup.

  Confirmed against the built library (SBCL 2.6.6, plump 20260218), with a
  policy where :remove-comments is nil:

      (sanitize "<!-- --!><img src=x onerror=alert(1)> -->" policy)
        => "<!-- --!><img src=x onerror=alert(1)> -->"   ; unchanged

  A browser closes the comment at "--!>" and executes the <img> onerror
  handler.  The entity-encoded variants ("&#45;&#45;!>", "&#45;&#45;&#62;")
  reach the same sink because Plump decodes them first.  Parsing the
  vulnerable output with a spec-compliant engine (html5lib) confirms the
  <img>/<svg>/<script> escape the comment and become live nodes.

  Under the default, strict, and email policies the same input yields "",
  as comments are removed; only the non-default :remove-comments nil
  configuration is affected.

  The proximate cause is a Plump parse/serialize round-trip that is not
  browser-faithful for comments.  The fix places responsibility in the
  sanitizer -- the component that makes the security guarantee -- rather
  than depending on the general-purpose parser's fidelity.

recommendation: |
  Update to cl-sanitize-html 1.0.2 or later (the fix landed on main via
  PR #4, commit 1c4cdcd).  The fix neutralizes
  preserved comment text before serialization, operating on Plump's
  already-decoded text so entity-encoded terminators are covered: it
  collapses runs of hyphens so "--" -- and therefore "-->", "--!>", and
  "<!--" -- cannot appear, and pads a leading ">"/"-" or a trailing "-" so
  the abrupt-close ("<!-->", "<!--->") and closing-delimiter merge cases
  cannot form.

  As an interim measure, callers can leave comment removal at its default
  (:remove-comments t), which strips comments entirely and is unaffected.

