id: CL-SEC-2026-0210
title: "gRPC client crash on malformed percent-encoded grpc-message trailer"
reported: 2026-06-21
published: 2026-06-21
severity: low
cvss: "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:N/I:N/A:L"
