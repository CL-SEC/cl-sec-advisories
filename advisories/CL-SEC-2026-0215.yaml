description: |
  The sanitize-html entry point (src/sanitizer.lisp) wraps parsing and DOM
  traversal in a handler-case and documents that "If parsing fails, return
  empty string for safety."  However, the handler catches only ERROR:

      (handler-case
          (let* ((root (plump:parse html-string)) ...)
            ...)
        (error (e) ... ""))

  Deeply nested HTML causes unbounded recursion.  Plump's parser builds the
  tree with a recursive read-children (one stack frame per nesting level)
  *before* the sanitizer's own recursive traversal runs, so the control
  stack is exhausted inside plump:parse.  On SBCL this signals
  CONTROL-STACK-EXHAUSTED, which is a STORAGE-CONDITION -- a subtype of
  SERIOUS-CONDITION, NOT of ERROR.  It therefore bypasses the handler and
  propagates to the caller as an unhandled condition, defeating the
  advertised fail-safe.

  This is an input-driven complexity blowup from a single request, not a
  volumetric flood.  Confirmed against the built library (SBCL 2.6.6,
  default control-stack size): roughly 20,000 nested elements -- about
  98 KB of input, and closing tags are not even required -- is sufficient:

      (sanitize (with-output-to-string (s)
                  (dotimes (i 20000) (write-string "<div>" s))))
        => uncaught CONTROL-STACK-EXHAUSTED escapes SANITIZE

  A service that sanitizes untrusted HTML (user-generated content, inbound
  email) and does not itself wrap the call in a STORAGE-CONDITION handler
  will have the request thread / worker killed by a small crafted payload.

recommendation: |
  Update to cl-sanitize-html 1.0.2 or later (the fix landed on main via
  PR #4, commit 59995d3).  The fix broadens the guard
  to "(or storage-condition error)"; because HANDLER-CASE unwinds the deep
  stack before running the handler, returning "" is reliable.  Interrupts
  and other non-storage serious-conditions still propagate.

  As an interim measure, callers embedding an older version should wrap
  their sanitize call in their own handler for STORAGE-CONDITION (or bound
  input size / nesting depth before sanitizing).

