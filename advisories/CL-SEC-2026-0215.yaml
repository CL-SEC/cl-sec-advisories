id: CL-SEC-2026-0215
title: "Deeply nested input escapes the fail-safe handler in cl-sanitize-html, causing denial of service"
reported: 2026-08-07         # date the advisory was drafted
published: 2026-08-07       # date of public disclosure
severity: medium
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:L"
cvss-score: 5.3
cwe: CWE-674  # Uncontrolled Recursion (see also CWE-400 Uncontrolled Resource Consumption)

