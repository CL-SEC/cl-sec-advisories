id: CL-SEC-2026-0216
title: "Unbounded recursion in DER parser allows remote denial of service via a hostile certificate in pure-tls"
reported: 2026-09-17
published: 2026-09-17
severity: high
cvss: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H"
cvss-score: 7.5
cwe: CWE-674  # Uncontrolled Recursion

project:
  name: pure-tls
  homepage: https://github.com/atgreen/pure-tls
  affected-systems:
    - pure-tls

affected:
  introduced-in:  # 2026-01-02, initial implementation
    commit: "a3076f0"
    url: "https://github.com/atgreen/pure-tls/commit/a3076f0"
  fixed-in:
    commit: "db7a6ec"
    version: "1.15.0"
    url: "https://github.com/atgreen/pure-tls/commit/db7a6ec"
  affected-dists:
